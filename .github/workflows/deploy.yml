# 构建静态站点并部署到 GitHub Pages。
# 仓库页面 Settings → Pages → Source 选择 “GitHub Actions”。
# 统计默认使用项目内配置的 Cloudflare Web Analytics 站点令牌。
# 分叉项目可在仓库 Settings → Secrets → Actions 添加 CLOUDFLARE_ANALYTICS_TOKEN 覆盖。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@10.9.4
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Build static site
        run: npm run build:static
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
